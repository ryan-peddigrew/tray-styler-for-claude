; Windows 11 System Tray Styler for Claude - created by Ryan Peddigrew.
; One glass tray bubble: Claude session/week usage rings with reset countdowns | clock + battery.
; TrayGlass.exe (in @Resources, built by install.ps1) adds the blur + 12 px corners, keeps the bubble's
; right edge RightGap px from the taskbar's right edge and its top TopOffset px below the taskbar top,
; and slides it with an auto-hide taskbar (event-driven, no polling).
; Usage numbers come from the local Tray Styler usage service (http://127.0.0.1:47823/, once a minute).
[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!ZPos 2][!Draggable 0][!ClickThrough 0][!KeepOnScreen 0][!Move #X# #Y#]["#@#TrayGlass.exe" "#CURRENTPATH##CURRENTFILE#" "#CURRENTCONFIG#" #RightGap# #TopOffset#]

[Metadata]
Name=Windows 11 System Tray Styler for Claude
Author=Ryan Peddigrew
Version=0.1.0
Information=Claude session/week usage rings with reset countdowns, plus a clock with a small battery line, in one glass tray bubble. Needs the Tray Styler usage service (install.ps1).

[Variables]
; Placement, in physical screen px, applied by TrayGlass.exe. Defaults suit a taskbar with a floating dock
; (Windhawk Taskbar Styler); use TopOffset=0 for the stock Windows 11 taskbar.
RightGap=6
TopOffset=4
; First position before TrayGlass.exe takes over (logical px).
X=(#SCREENAREAWIDTH#-183)
Y=(#SCREENAREAHEIGHT#-67)
; Height/corners in logical px (x1.25 on screen at 125% scaling): 64.8 tall, 9.6 corners.
H=64.8
Rad=9.6
R0=12.8
RingY=10.1
RingTxtY=49.9
TimeY=18.1
DateY=33.2
BatY=45.46
BatTxtY=49.1
DivY=13.4
DivH=38
Font=Inter
ClockFont=Inter Display
Muted=167,169,178
White=242,242,244
Green=127,207,154
Yellow=232,207,106
Orange=240,160,96
Red=232,116,106
Unknown=120,122,130
Track=255,255,255,36
A1=35
A2=35
A3=35
A4=35
A5=35
Divider=255,255,255,36
; Glass tint matches a #A4101010 taskbar; edge = dock top highlight.
Tint=16,16,16,164
Highlight=255,255,255,50
BatFill=242,242,244
UsageUrl=http://127.0.0.1:47823/

; ---------- usage feed: one local request a minute; every field comes from this one response ----------
[mFeed]
Measure=WebParser
URL=#UsageUrl#
CodePage=65001
UpdateRate=60
RegExp=(?siU)<sp>(.*)</sp>.*<wp>(.*)</wp>.*<scd>(.*)</scd>.*<wcd>(.*)</wcd>.*<st>(.*)</st>
FinishAction=[!SetOption MeterNumS Text "%1"][!SetOption MeterNumW Text "%1"][!UpdateMeasure mS][!UpdateMeasure mW][!UpdateMeasure mCd][!UpdateMeasure mWeekCd][!UpdateMeasure mSt][!SetOption MeterUsageHit ToolTipText "%1"][!UpdateMeter *][!Redraw]
OnConnectErrorAction=[!SetOption MeterNumS Text "-"][!SetOption MeterNumW Text "-"][!SetOption MeterRingS LineColor "#Unknown#"][!SetOption MeterRingW LineColor "#Unknown#"][!SetOption MeterUsageHit ToolTipText "Usage service not running. Start Tray Styler for Claude from the Start menu."][!UpdateMeter *][!Redraw]
OnRegExpErrorAction=[!SetOption MeterUsageHit ToolTipText "Usage service sent an unexpected response. Update the usage service."][!UpdateMeter MeterUsageHit]

; Percent, or -1 when the service has no data (shown as "-" with a grey ring).
[mS]
Measure=WebParser
URL=[mFeed]
StringIndex=1
MinValue=0
MaxValue=100
RegExpSubstitute=1
Substitute="^-1$":"-"
IfCondition=mS < 0
IfTrueAction=[!SetOption MeterRingS LineColor #Unknown#]
IfCondition2=(mS >= 0) && (mS < 30)
IfTrueAction2=[!SetOption MeterRingS LineColor #Green#]
IfCondition3=(mS >= 30) && (mS < 60)
IfTrueAction3=[!SetOption MeterRingS LineColor #Yellow#]
IfCondition4=(mS >= 60) && (mS < 85)
IfTrueAction4=[!SetOption MeterRingS LineColor #Orange#]
IfCondition5=mS >= 85
IfTrueAction5=[!SetOption MeterRingS LineColor #Red#]

[mW]
Measure=WebParser
URL=[mFeed]
StringIndex=2
MinValue=0
MaxValue=100
RegExpSubstitute=1
Substitute="^-1$":"-"
IfCondition=mW < 0
IfTrueAction=[!SetOption MeterRingW LineColor #Unknown#]
IfCondition2=(mW >= 0) && (mW < 30)
IfTrueAction2=[!SetOption MeterRingW LineColor #Green#]
IfCondition3=(mW >= 30) && (mW < 60)
IfTrueAction3=[!SetOption MeterRingW LineColor #Yellow#]
IfCondition4=(mW >= 60) && (mW < 85)
IfTrueAction4=[!SetOption MeterRingW LineColor #Orange#]
IfCondition5=mW >= 85
IfTrueAction5=[!SetOption MeterRingW LineColor #Red#]

; Session and weekly reset countdowns ("2h 29m", "6d 4h"), counted live by the service on each request.
[mCd]
Measure=WebParser
URL=[mFeed]
StringIndex=3

[mWeekCd]
Measure=WebParser
URL=[mFeed]
StringIndex=4

; "OK", or why data is missing or stale (e.g. sign-in expired); shown as the rings' hover text.
[mSt]
Measure=WebParser
URL=[mFeed]
StringIndex=5
Substitute="&lt;":"<","&gt;":">","&quot;":"'","&apos;":"'","&amp;":"&"

; ---------- battery (white; turns green while charging; every 30 s) ----------
[mPct]
Measure=Plugin
Plugin=PowerPlugin
PowerState=PERCENT
UpdateDivider=30

[mAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE
UpdateDivider=30
IfCondition=mAC = 1
IfTrueAction=[!SetVariable BatFill "#Green#"][!UpdateMeter *][!Redraw]
IfFalseAction=[!SetVariable BatFill "#White#"][!UpdateMeter *][!Redraw]

[mFilled]
Measure=Calc
Formula=Ceil(mPct / 20)
UpdateDivider=30
IfCondition=mFilled >= 1
IfTrueAction=[!SetVariable A1 255]
IfFalseAction=[!SetVariable A1 35]
IfCondition2=mFilled >= 2
IfTrueAction2=[!SetVariable A2 255]
IfFalseAction2=[!SetVariable A2 35]
IfCondition3=mFilled >= 3
IfTrueAction3=[!SetVariable A3 255]
IfFalseAction3=[!SetVariable A3 35]
IfCondition4=mFilled >= 4
IfTrueAction4=[!SetVariable A4 255]
IfFalseAction4=[!SetVariable A4 35]
IfCondition5=mFilled >= 5
IfTrueAction5=[!SetVariable A5 255]
IfFalseAction5=[!SetVariable A5 35]
OnChangeAction=[!UpdateMeter MeterSegs][!Redraw]

; ---------- clock ----------
[mTime]
Measure=Time
Format=%#I:%M %p

[mDate]
Measure=Time
Format=%a, %b. %#d

; ---------- bubble ----------
[MeterBubble]
Meter=Shape
Shape=Rectangle 0,0,177.1,#H#,#Rad# | Fill Color #Tint# | StrokeWidth 0
; Dock-style edge: a 1 px white highlight on the top edge only, fading out down the sides.
Shape2=Rectangle 0.4,0.4,176.3,(#H#-0.8),(#Rad#-0.4) | Fill Color 0,0,0,0 | StrokeWidth 0.8 | Stroke LinearGradient Edge
Edge=270 | #Highlight# ; 0.0 | 255,255,255,0 ; 0.22

; ---------- rings (28px, 2.6px stroke) with the reset countdown under each ----------
[MeterTrackS]
Meter=Shape
X=#R0#
Y=#RingY#
Shape=Ellipse 15.5,15.5,14.2 | Fill Color 0,0,0,0 | StrokeWidth 2.6 | Stroke Color #Track#

[MeterRingS]
Meter=Roundline
MeasureName=mS
X=#R0#
Y=#RingY#
W=31
H=31
StartAngle=4.712389
RotationAngle=6.283185
LineStart=12.9
LineLength=15.5
Solid=1
LineColor=#Unknown#
AntiAlias=1

[MeterNumS]
Meter=String
MeasureName=mS
X=(#R0#+14.7)
Y=(#RingY#+16)
StringAlign=CenterCenter
FontFace=#Font#
FontWeight=600
FontSize=9
FontColor=#White#
AntiAlias=1
Text=-

[MeterResetS]
Meter=String
MeasureName=mCd
X=(#R0#+14.7)
Y=#RingTxtY#
StringAlign=CenterCenter
FontFace=#Font#
FontWeight=500
FontSize=6.8
FontColor=214,216,222
AntiAlias=1
Text=%1

[MeterTrackW]
Meter=Shape
X=(#R0#+41)
Y=#RingY#
Shape=Ellipse 15.5,15.5,14.2 | Fill Color 0,0,0,0 | StrokeWidth 2.6 | Stroke Color #Track#

[MeterRingW]
Meter=Roundline
MeasureName=mW
X=(#R0#+41)
Y=#RingY#
W=31
H=31
StartAngle=4.712389
RotationAngle=6.283185
LineStart=12.9
LineLength=15.5
Solid=1
LineColor=#Unknown#
AntiAlias=1

[MeterNumW]
Meter=String
MeasureName=mW
X=(#R0#+55.7)
Y=(#RingY#+16)
StringAlign=CenterCenter
FontFace=#Font#
FontWeight=600
FontSize=9
FontColor=#White#
AntiAlias=1
Text=-

[MeterResetW]
Meter=String
MeasureName=mWeekCd
X=(#R0#+55.7)
Y=#RingTxtY#
StringAlign=CenterCenter
FontFace=#Font#
FontWeight=500
FontSize=6.8
FontColor=214,216,222
AntiAlias=1
Text=%1

; Hover over the rings: status line. Click: open the Claude usage page.
[MeterUsageHit]
Meter=Image
X=0
Y=0
W=(#R0#+82)
H=#H#
SolidColor=0,0,0,1
ToolTipTitle=Claude usage (session | week)
MeasureName=mSt
ToolTipText=Waiting for the usage service...
LeftMouseUpAction=["https://claude.ai/settings/usage"]

; ---------- clock section: time, date, and a small battery line under the date ----------
[MeterDividerClock]
Meter=Shape
X=(#R0#+84.3)
Y=#DivY#
Shape=Rectangle 0,0,1,#DivH# | Fill Color #Divider# | StrokeWidth 0

; Large semibold time with a small AM/PM, quiet muted date underneath.
[MeterTime]
Meter=String
MeasureName=mTime
X=(#R0#+123.6)
Y=#TimeY#
StringAlign=CenterCenter
FontFace=#ClockFont#
FontWeight=600
FontSize=10.9
FontColor=#White#
AntiAlias=1
InlinePattern=[AP]M$
InlineSetting=Size | 6.5
InlinePattern2=.*
InlineSetting2=CharacterSpacing | 0.35 | 0.35

[MeterDate]
Meter=String
MeasureName=mDate
X=(#R0#+123.6)
Y=#DateY#
StringAlign=CenterCenter
FontFace=#Font#
FontWeight=500
FontSize=7.25
FontColor=#Muted#
AntiAlias=1

; Horizontal hairline (same as the | divider) between the date and the battery.
[MeterDividerBat]
Meter=Shape
X=(#R0#+103.2)
Y=40
Shape=Rectangle 0,0,40,1 | Fill Color 255,255,255,26 | StrokeWidth 0
AntiAlias=0

; Small classic battery (outline + nub) with 5 slots lit by charge, % beside it; green while charging.
[MeterSegs]
Meter=Shape
X=([MeterDate:X]+[MeterDate:W]/2-(22.6+[MeterPct:W])/2)
Y=#BatY#
Shape=Rectangle 0.42,0.42,17.08,6.87,2.01 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color 242,242,244,150
Shape2=Rectangle 18.17,2.18,1.42,3.35,0.71 | Fill Color 242,242,244,150 | StrokeWidth 0
Shape3=Rectangle 1.84,1.84,2.35,4.02,0.67 | Fill Color #BatFill#,#A1# | StrokeWidth 0
Shape4=Rectangle 4.81,1.84,2.35,4.02,0.67 | Fill Color #BatFill#,#A2# | StrokeWidth 0
Shape5=Rectangle 7.79,1.84,2.35,4.02,0.67 | Fill Color #BatFill#,#A3# | StrokeWidth 0
Shape6=Rectangle 10.76,1.84,2.35,4.02,0.67 | Fill Color #BatFill#,#A4# | StrokeWidth 0
Shape7=Rectangle 13.73,1.84,2.35,4.02,0.67 | Fill Color #BatFill#,#A5# | StrokeWidth 0
DynamicVariables=1

[MeterPct]
Meter=String
MeasureName=mPct
X=([MeterSegs:X]+22.6)
Y=#BatTxtY#
StringAlign=LeftCenter
FontFace=#Font#
FontWeight=500
FontSize=6.35
FontColor=#BatFill#
AntiAlias=1
Text=%1%
DynamicVariables=1

; Click the clock: open the Windows calendar flyout (Win+Alt+D).
[MeterClockHit]
Meter=Image
X=(#R0#+96.1)
Y=0
W=56
H=(#H#-14)
SolidColor=0,0,0,1
LeftMouseUpAction=["#@#TrayGlass.exe" calendar]
